<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f6f61">
    <title>ISMB 2026</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ISMB 2026</p>
          <h1>Schedule</h1>
        </div>
        <button class="icon-button" id="shareButton" type="button" aria-label="Share selected schedule" title="Share selected schedule">
          <span aria-hidden="true">Share</span>
        </button>
      </header>

      <section class="controls" aria-label="Schedule controls">
        <label class="search-field">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Title, presenter, author, room">
        </label>
        <div class="filter-row">
          <select id="dayFilter" aria-label="Filter by day"></select>
          <select id="trackFilter" aria-label="Filter by track"></select>
        </div>
        <div class="tabs" role="tablist" aria-label="Schedule view">
          <button class="tab active" id="allTab" type="button">All</button>
          <button class="tab" id="mineTab" type="button">Mine <span id="savedCount">0</span></button>
        </div>
      </section>

      <main>
        <div class="status-line" id="statusLine">Loading schedule...</div>
        <section class="session-list" id="sessionList" aria-live="polite"></section>
      </main>
    </div>

    <dialog id="sessionDialog">
      <article class="dialog-card">
        <button class="icon-button close-button" id="closeDialog" type="button" aria-label="Close" title="Close">x</button>
        <p class="time-pill" id="dialogTime"></p>
        <h2 id="dialogTitle"></h2>
        <p class="meta" id="dialogMeta"></p>
        <p class="presenter" id="dialogPresenter"></p>
        <p class="authors" id="dialogAuthors"></p>
        <p class="abstract" id="dialogAbstract"></p>
      </article>
    </dialog>

    <script src="data/schedule-data.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
